<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROY MART — Premium Korean Streetwear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      --bg: #0d0d0d;
      --panel: rgba(22, 22, 22, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8f8f8;
      --muted: #c8c8d0;
      --accent: #ff6ec7;
      --accent2: #8a7dff;
      --shadow: 0 28px 120px rgba(0, 0, 0, 0.28);
    }
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, rgba(138, 125, 255, 0.2), transparent 34%),
                  radial-gradient(circle at 20% 90%, rgba(255, 110, 199, 0.15), transparent 24%),
                  #0d0d0d;
      color: var(--text);
    }
    body {
      overflow-x: hidden;
    }
    section {
      padding-top: 3rem;
      padding-bottom: 3rem;
    }
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(13,13,13,1), rgba(13,13,13,0.92));
      backdrop-filter: blur(12px);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255, 110, 199, 0.88);
      animation: spin 1.4s linear infinite;
      box-shadow: 0 0 40px rgba(255,110,199,0.18);
    }
    @keyframes spin { to { transform: rotate(360deg);} }
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0;
      z-index: 9998;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 0 18px rgba(255,110,199,0.45);
    }
    .cursor-glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      background: rgba(255, 110, 199, 0.18);
      box-shadow: 0 0 36px rgba(255, 110, 199, 0.28), 0 0 88px rgba(138, 125, 255, 0.18);
      mix-blend-mode: screen;
      transition: transform 0.14s ease, width 0.14s ease, height 0.14s ease;
      z-index: 9999;
    }
    .root-wrap {
      position: relative;
      padding-bottom: 80px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: rgba(13,13,13,0.72);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: padding 0.3s ease, background 0.3s ease, transform 0.4s ease;
    }
    header.scrolled {
      background: rgba(13,13,13,0.88);
      padding: 10px 18px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.24);
    }
    nav a {
      color: rgba(255,255,255,0.8);
      transition: color 0.25s ease;
    }
    nav a:hover {
      color: #fff;
    }
    .glass-panel {
      background: rgba(22,22,22,0.72);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: 26px;
    }
    .section-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .button-primary {
      border: none;
      outline: none;
      background: linear-gradient(135deg, #ff6ec7, #8a7dff);
      color: #fff;
      padding: 1rem 1.8rem;
      font-weight: 700;
      border-radius: 999px;
      letter-spacing: 0.01em;
      box-shadow: 0 20px 64px rgba(138,125,255,0.22);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease, opacity 0.25s ease;
    }
    .button-primary:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 28px 88px rgba(138,125,255,0.32);
      filter: saturate(1.2);
      opacity: 0.98;
    }
    .button-primary:active {
      transform: translateY(0) scale(0.98);
    }
    .button-secondary {
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      background: rgba(255,255,255,0.04);
      padding: 1rem 1.6rem;
      border-radius: 999px;
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }
    .button-secondary:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(255,255,255,0.08);
    }
    .button-secondary:active {
      transform: translateY(0) scale(0.98);
    }
    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 48px 120px rgba(0,0,0,0.3);
    }
    .hero-card::before,
    .hero-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(160px);
      opacity: 0.76;
    }
    .hero-card::before {
      width: 340px;
      height: 340px;
      top: -80px;
      right: -100px;
      background: rgba(138,125,255,0.22);
    }
    .hero-card::after {
      width: 280px;
      height: 280px;
      bottom: -100px;
      left: -90px;
      background: rgba(255,110,199,0.18);
    }
    .product-card {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: rgba(18,18,18,0.92);
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .product-card::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,110,199,0.04), rgba(138,125,255,0.04));
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .product-card:hover::after {
      opacity: 1;
    }
    .product-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: rgba(255,110,199,0.35);
      box-shadow: 0 40px 90px rgba(138,125,255,0.22);
    }
    .product-card:hover .product-image {
      transform: scale(1.14);
    }
    .product-image {
      width: 100%;
      height: 280px;
      object-fit: cover;
      transition: transform 0.75s cubic-bezier(0.22,1,0.36,1);
    }
    .glass-badge {
      backdrop-filter: blur(16px);
      background: rgba(15,15,15,0.56);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 48px rgba(0,0,0,0.16);
      border-radius: 18px;
    }
    .cursor-glow.active {
      width: 50px;
      height: 50px;
      box-shadow: 0 0 42px rgba(255,110,199,0.3), 0 0 120px rgba(138,125,255,0.24);
    }
    .menu-link {
      position: relative;
      transition: color 0.25s ease, transform 0.25s ease;
    }
    .menu-link:hover {
      transform: translateY(-1px);
    }
    .gradient-pill {
      display: inline-flex;
      background: linear-gradient(135deg, rgba(255,110,199,0.18), rgba(138,125,255,0.18));
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .glass-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 1rem 1.2rem;
      border-radius: 20px;
      width: 100%;
      outline: none;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }
    .glass-input:focus {
      border-color: rgba(138,125,255,0.6);
      transform: translateY(-1px);
    }
    .scroll-fade {
      opacity: 0;
      transform: translateY(40px);
      filter: blur(10px);
    }
    .animate-in {
      opacity: 1 !important;
      transform: translateY(0) !important;
      filter: blur(0) !important;
      transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.68);
    }
    .hero-eyebrow span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff6ec7, transparent 45%);
      box-shadow: 0 0 18px rgba(255,110,199,0.25);
    }
    .glass-footer {
      background: rgba(15,15,15,0.7);
      border-top: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
    }
    .glow-ring {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,110,199,0.15), transparent 40%);
      opacity: 0.9;
      mix-blend-mode: screen;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.75rem 1rem;
      border-radius: 16px;
      color: #fff;
      font-weight: 600;
    }
    .hero-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    .hero-background span {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.75;
    }
    .hero-background .one { width: 340px; height: 340px; top: -40px; right: 10%; background: rgba(255,110,199,0.18);} 
    .hero-background .two { width: 270px; height: 270px; bottom: 10%; left: 8%; background: rgba(138,125,255,0.18);} 
    .hero-background .three { width: 200px; height: 200px; top: 42%; left: 65%; background: rgba(255,255,255,0.08);} 
    .small-glow { position: absolute; width: 80px; height: 80px; border-radius: 50%; background: rgba(138,125,255,0.22); top: 18%; left: 30%; filter: blur(30px); }
    .menu-link { position: relative; }
    .menu-link::after { content: ''; position: absolute; left: 0; bottom: -4px; width: 0; height: 2px; background: linear-gradient(90deg, #ff6ec7, #8a7dff); transition: width 0.25s ease; }
    .menu-link:hover::after { width: 100%; }
    @media (max-width: 960px) {
      .hero-card { border-radius: 24px; }
      .product-image { height: 220px; }
    }
    @media (max-width: 768px) {
      .button-primary, .button-secondary { width: 100%; }
      .hero-eyebrow { font-size: 0.78rem; }
      .hero-card::before { width: 240px; height: 240px; top: -100px; right: -70px; }
      .hero-card::after { width: 200px; height: 200px; bottom: -90px; left: -50px; }
    }
    @media (max-width: 640px) {
      header { padding: 14px 16px; }
      .product-image { height: 200px; }
      .glass-input { padding: 0.95rem 1rem; }
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="loader-ring"></div>
  </div>
  <div class="progress-bar" id="progressBar"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState, useMemo } = React;

    const products = [
      { name: 'ROY Seoul Fit Tee', price: 899, desc: 'Soft premium knit with oversized Korean street silhouette.', category: 'Tops', image: 'https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY K-Street Oversize', price: 799, desc: 'Relaxed fit layering piece with bold Seoul details.', category: 'Tops', image: 'https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Han Black Tee', price: 499, desc: 'Minimal black tee with refined Korean brand script.', category: 'Tops', image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Minimal Korea Shirt', price: 599, desc: 'Signature street shirt with premium fabric and refined cut.', category: 'Shirts', image: 'https://images.unsplash.com/photo-1503342452485-86a4d3dcd82c?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Phantom Void Hoodie', price: 1299, desc: 'Heavyweight hoodie with subtle glowing brand embroidery.', category: 'Hoodies', image: 'https://images.unsplash.com/photo-1520975922511-3b5b89b6725e?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Cargo Flux Pants', price: 1199, desc: 'Premium cargo pants with multi-pocket utility and soft drape.', category: 'Bottoms', image: 'https://images.unsplash.com/photo-1530089701640-72aa7c23be0f?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Neon Korea Drop', price: 1999, desc: 'Limited neon edition drop with holographic details.', category: 'Drops', image: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Seoul Cargo Pants', price: 999, desc: 'Utility pants crafted for dynamic city movement.', category: 'Bottoms', image: 'https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Lunar Windbreaker', price: 1099, desc: 'Lightweight shell with reflective accents for night styling.', category: 'Outerwear', image: 'https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Seoul Chain Accent', price: 399, desc: 'Polished street chain designed to finish any fit.', category: 'Accessories', image: 'https://images.unsplash.com/photo-1514996937319-344454492b37?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY K-Pop Minimal Cap', price: 299, desc: 'Adjustable premium cap with low-key brand embroidery.', category: 'Accessories', image: 'https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Street Wave Tee', price: 699, desc: 'Graphic tee with Seoul-inspired wave texture.', category: 'Tops', image: 'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Void Panel Hoodie', price: 1499, desc: 'Luxuriously soft hoodie with tonal panel accents.', category: 'Hoodies', image: 'https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Daybreak Shirt', price: 649, desc: 'Airy shirt tailored for bold streetwear styling.', category: 'Shirts', image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Midnight Cargo', price: 899, desc: 'Slim cargo with adaptive stretch and polished finish.', category: 'Bottoms', image: 'https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Aero Oversize Shirt', price: 799, desc: 'Oversized statement shirt with premium silk blend.', category: 'Shirts', image: 'https://images.unsplash.com/photo-1530089701640-72aa7c23be0f?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Seoul Minimal Hoodie', price: 1099, desc: 'Clean hoodie refined for everyday confidence.', category: 'Hoodies', image: 'https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Nightfall Tee', price: 499, desc: 'Soft black premium tee with modern neckline.', category: 'Tops', image: 'https://images.unsplash.com/photo-1503342452485-86a4d3dcd82c?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Reflection Sunglasses', price: 699, desc: 'Sleek sunglass design for urban night scenes.', category: 'Accessories', image: 'https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY Seoul Fit TrackPant', price: 999, desc: 'Street silhouette track pant with premium taper.', category: 'Bottoms', image: 'https://images.unsplash.com/photo-1520975922511-3b5b89b6725e?auto=format&fit=crop&w=900&q=80' },
      { name: 'ROY K-Street Blazer', price: 1799, desc: 'Modern structured blazer for elevated street outfits.', category: 'Outerwear', image: 'https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=900&q=80' },
    ];

    const testimonials = [
      { quote: 'ROY MART transformed my wardrobe into a Seoul-inspired statement. The fit and quality are unmatched.', name: 'Jae Min', title: 'Streetwear Curator' },
      { quote: 'Every drop feels premium yet effortless. Delivery was fast and styling guidance is flawless.', name: 'Ariana Kim', title: 'Creative Director' },
      { quote: 'The glow details and fabric are next-level. This brand really knows how to present luxury streetwear.', name: 'Noah Lee', title: 'Style Editor' },
    ];

    const recommendations = [
      'ROY Seoul Cargo Pants', 'ROY Neon Korea Drop', 'ROY Minimal Korea Shirt', 'ROY Aero Oversize Shirt'
    ];

    const filters = ['All', 'Tops', 'Shirts', 'Hoodies', 'Bottoms', 'Accessories', 'Outerwear'];

    const App = () => {
      const [query, setQuery] = useState('');
      const [category, setCategory] = useState('All');
      const [priceRange, setPriceRange] = useState('all');
      const [cartCount, setCartCount] = useState(0);
      const [showPopup, setShowPopup] = useState(true);
      const [activeSection, setActiveSection] = useState('home');

      const filteredProducts = useMemo(() => {
        return products.filter(item => {
          const passQuery = item.name.toLowerCase().includes(query.toLowerCase()) || item.desc.toLowerCase().includes(query.toLowerCase());
          const passCategory = category === 'All' || item.category === category;
          const passPrice = priceRange === 'all' || (priceRange === 'budget' && item.price <= 799) || (priceRange === 'premium' && item.price > 799);
          return passQuery && passCategory && passPrice;
        });
      }, [query, category, priceRange]);

      useEffect(() => {
        const root = document.querySelector('header');
        const progress = document.getElementById('progressBar');
        const cursor = document.getElementById('cursorGlow');
        const navLinks = Array.from(document.querySelectorAll('a[href^="#"]'));
        const interactive = Array.from(document.querySelectorAll('button, .menu-link, .product-card'));
        const onScroll = () => {
          const isScrolled = window.scrollY > 20;
          root.classList.toggle('scrolled', isScrolled);
          const scrollProgress = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
          progress.style.width = `${scrollProgress}%`;
          const currentSection = ['home','shop','drops','collection','about','contact'].find(id => {
            const section = document.getElementById(id);
            return section && section.offsetTop - 120 <= window.scrollY;
          });
          if (currentSection) setActiveSection(currentSection);
        };
        const onMove = (e) => {
          cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        };
        const onNavClick = (event) => {
          const target = event.currentTarget.getAttribute('href');
          if (target && target.startsWith('#')) {
            const anchor = document.querySelector(target);
            if (anchor) {
              event.preventDefault();
              window.scrollTo({ top: anchor.offsetTop - 88, behavior: 'smooth' });
            }
          }
        };
        const activateGlow = () => cursor.classList.add('active');
        const deactivateGlow = () => cursor.classList.remove('active');

        window.addEventListener('scroll', onScroll);
        window.addEventListener('mousemove', onMove);
        navLinks.forEach(link => link.addEventListener('click', onNavClick));
        interactive.forEach(el => {
          el.addEventListener('mouseenter', activateGlow);
          el.addEventListener('mouseleave', deactivateGlow);
        });
        setTimeout(() => {
          document.getElementById('preloader').classList.add('hidden');
        }, 1300);
        return () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('mousemove', onMove);
          navLinks.forEach(link => link.removeEventListener('click', onNavClick));
          interactive.forEach(el => {
            el.removeEventListener('mouseenter', activateGlow);
            el.removeEventListener('mouseleave', deactivateGlow);
          });
        };
      }, []);

      useEffect(() => {
        gsap.registerPlugin(ScrollTrigger);
        gsap.utils.toArray('.scroll-fade').forEach((section, index) => {
          gsap.fromTo(section, { opacity: 0, y: 40, filter: 'blur(10px)' }, {
            opacity: 1,
            y: 0,
            filter: 'blur(0px)',
            duration: 1,
            delay: index * 0.08,
            ease: 'power3.out',
            scrollTrigger: { trigger: section, start: 'top 88%' }
          });
        });
      }, []);

      const handleAdd = () => setCartCount(cartCount + 1);
      const suggestions = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase())).slice(0,4);

      return (
        <div className="root-wrap px-6 md:px-10 lg:px-16 pb-16">
          <header className="scroll-fade px-4 py-6 md:px-8 transition-all duration-300">
            <div className="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
